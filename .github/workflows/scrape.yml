name: Hotel Price Scraper

on:
  # Triggered externally by cron-job.org via the GitHub API for precise timing.
  # To trigger manually from the GitHub Actions UI, use "Run workflow" below.
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run mode (daily or weekly)"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - weekly

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Determine run mode
        id: mode
        run: echo "mode=${{ inputs.run_mode }}" >> $GITHUB_OUTPUT

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_1: ${{ secrets.EMAIL_1 }}
          EMAIL_2: ${{ secrets.EMAIL_2 }}
          EMAIL_3: ${{ secrets.EMAIL_3 }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          WEBSHARE_API_KEY: ${{ secrets.WEBSHARE_API_KEY }}
        run: python scraper/scraper.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
